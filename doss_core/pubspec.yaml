name: doss_core
description: Shared models, services, theme, and widgets for DOSS v6.
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  socket_io_client: ^2.0.3+1
  logger: ^2.0.2
  google_maps_flutter: ^2.6.0
  geolocator: ^12.0.0
  image_picker: ^1.0.7
  http: ^1.2.0
  http_parser: ^4.0.2
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  provider: ^6.1.2
  record: ^5.1.0
  just_audio: ^0.9.36
  url_launcher: ^6.2.5
  sensors_plus: ^4.0.2

flutter:
  uses-material-design: true
